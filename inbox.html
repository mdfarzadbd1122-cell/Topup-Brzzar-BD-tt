<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beep Bazar Style - FF Top-Up</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at top, #1a1a1a, #000);
      color: white;
      font-family: 'Poppins', sans-serif;
    }

    header {
      background: linear-gradient(90deg, #ff6600, #ff0000);
      padding: 15px 0;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      box-shadow: 0 2px 10px rgba(255, 100, 0, 0.5);
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      background: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(255, 90, 0, 0.3);
      text-align: center;
    }

    h2 {
      color: #ff9900;
      margin-bottom: 20px;
    }

    input, select {
      width: 90%;
      margin: 10px 0;
      padding: 12px;
      border: none;
      border-radius: 8px;
      outline: none;
      background-color: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 16px;
    }

    select option {
      background-color: #111;
      color: #fff;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #ff6600, #ff0000);
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(255, 80, 0, 0.5);
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.8);
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>🔥 Beep Bazar FF Diamond Top-Up 🔥</header>
  <div class="container">
    <h2>Enter Your Player ID</h2>
    <input type="text" placeholder="Enter your Player ID">

    <h2>Select Diamond Package</h2>
    <select>
      <option>100 Diamonds - $1</option>
      <option>500 Diamonds - $5</option>
      <option>1000 Diamonds - $10</option>
      <option>2000 Diamonds - $20</option>
    </select>

    <button>💎 Top-Up Now 💎</button>
  </div>

  <footer>⚠️ Demo Site Only | Not for Real Transactions ⚠️</footer>
</body>
</html>
